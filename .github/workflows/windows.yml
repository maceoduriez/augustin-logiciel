name: Windows build

# Build the Fityk + GUI for Windows (64-bit) with MSYS2/MinGW64 and upload a
# portable zip (fityk.exe + DLLs) as an artifact.
on:
  workflow_dispatch:
  push:
    tags: ['win-*']

jobs:
  windows:
    name: "Windows (MinGW64)"
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          git
          base-devel
          autotools
          mingw-w64-x86_64-toolchain
          mingw-w64-x86_64-wxwidgets3.2-msw
          mingw-w64-x86_64-boost
          mingw-w64-x86_64-lua
          mingw-w64-x86_64-zlib
          mingw-w64-x86_64-bzip2
          mingw-w64-x86_64-swig

    - name: force LF line endings on checkout
      shell: bash
      run: |
        git config --global core.autocrlf input
        git config --global core.eol lf

    - uses: actions/checkout@v4

    - name: build xylib (from source)
      run: |
        git clone --depth 1 https://github.com/wojdyr/xylib.git /tmp/xylib
        cd /tmp/xylib
        autoreconf -i
        ./configure --without-gui --prefix=/mingw64
        make -j4
        make install

    - name: build fityk
      run: |
        autoreconf -i
        # SWIG is passed explicitly to skip configure's AX_PKG_SWIG probe:
        # on MSYS2 `swig -swiglib` prints two lines, which ends up embedded
        # in SWIG_LIB in the generated Makefile -> "missing separator".
        # -std=gnu++14: le code utilise des specs d'exception dynamiques
        # (throw(...)) supprimees en C++17, defaut des GCC recents.
        ./configure --disable-python --disable-CLI \
            --disable-dependency-tracking \
            --with-wx-config=/mingw64/bin/wx-config \
            SWIG=/mingw64/bin/swig \
            CXXFLAGS="-g -O2 -std=gnu++14"
        make -j4

    - name: package portable zip
      run: |
        # the msys2 wrapper runs with -e -o pipefail: relax it, we check
        # explicitly at the end
        set +e +o pipefail
        mkdir -p pkg
        EXE=$(find wxgui -name 'fityk.exe' | head -1)
        echo "exe: $EXE"
        cp -v "$EXE" pkg/
        find fityk -name '*.dll' -exec cp -v {} pkg/ \;
        cp -v /mingw64/bin/libxy*.dll pkg/
        # all mingw64 DLLs the exe (and copied DLLs) depend on, recursively
        for i in 1 2 3; do
          deps=$(ldd pkg/*.exe pkg/*.dll 2>/dev/null | grep -i '/mingw64/' | awk '{print $3}' | sort -u)
          for d in $deps; do cp -n "$d" pkg/; done
        done
        ls -la pkg/
        # explicit success criteria
        test -f pkg/fityk.exe || { echo "MISSING pkg/fityk.exe"; exit 1; }
        test -f pkg/libfityk-4.dll || { echo "MISSING libfityk dll"; exit 1; }
        echo "packaging OK"

    - name: smoke test (DLL closure)
      run: |
        set +e +o pipefail
        missing=$(ldd pkg/fityk.exe | grep -i "not found")
        if [ -n "$missing" ]; then echo "DLLs manquantes: $missing"; exit 1; fi
        echo "DLL closure OK"

    - uses: actions/upload-artifact@v4
      with:
        name: fityk-plus-windows
        path: pkg/
